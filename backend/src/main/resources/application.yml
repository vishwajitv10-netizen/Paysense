server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
spring:
  application:
    name: paysense-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/paysense}
    username: ${DATABASE_USERNAME:paysense}
    password: ${DATABASE_PASSWORD:paysense_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  demo:
    initial-balance: ${DEMO_INITIAL_BALANCE:12840.50}
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-only-change-this-secret-before-deploy-2025}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
